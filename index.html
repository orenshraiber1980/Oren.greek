<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>oren.greek — מוזיקה יוונית, אירועים ואתונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#c9a84c;--gold-dark:#a07820;--gold-light:#e8c860;
  --dark:#2a1f14;--dark2:#3a2510;--cream:#f5efe6;--cream2:#f0e8d8;
  --white:#ffffff;--text:#4a3020;--text-light:#6b5040;
}
html{scroll-behavior:smooth;}
body{font-family:'Heebo',sans-serif;direction:rtl;background:var(--cream);color:var(--dark);overflow-x:hidden;}

/* TOPBAR */
#topbar{background:var(--dark);padding:9px 24px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:1000;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
#topbar a{color:var(--gold);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:5px;font-weight:500;transition:opacity 0.2s;}
#topbar a:hover{opacity:0.7;}
#topbar span{color:rgba(201,168,76,0.3);font-size:12px;}

/* NAV */
nav{background:rgba(42,31,20,0.95);display:flex;justify-content:center;flex-wrap:wrap;border-bottom:2px solid var(--gold);position:sticky;top:37px;z-index:999;backdrop-filter:blur(10px);}
nav a{color:rgba(245,239,230,0.75);text-decoration:none;padding:13px 18px;font-size:13px;display:block;transition:all 0.2s;position:relative;}
nav a::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--gold);transform:scaleX(0);transition:transform 0.25s;}
nav a:hover{color:var(--gold);}
nav a:hover::after{transform:scaleX(1);}

/* HERO */
#hero{position:relative;height:100vh;min-height:600px;max-height:800px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.hero-bg{
  position:absolute;
  inset:0;
  background-image: url('https://images.unsplash.com/photo-1533105079780-92b9be482077?q=80&w=1920&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
/* SHADOW OVERLAY */
.hero-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(42, 31, 20, 0.55);
}

.hero-content{
  position: relative;
  z-index: 2;
  text-align: center;
  color: var(--white);
  padding: 20px;
}
.hero-title{
  font-size: 3.5rem;
  font-family: 'Cormorant Garamond', serif;
  color: var(--gold);
  margin-bottom: 12px;
  text-shadow: 0 3px 6px rgba(0,0,0,0.7);
}
.hero-subtitle{
  font-size: 1.3rem;
  max-width: 600px;
  margin: 0 auto;
  font-weight: 300;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<header>
  <!-- TOPBAR -->
  <div id="topbar">

    <span>|</span>
    <a href="https://tiktok.com" target="_blank" rel="noopener"><i class="ti ti-brand-tiktok"></i> בטיקטוק</a>
    <span>|</span>
    <a href="https://facebook.com" target="_blank" rel="noopener"><i class="ti ti-brand-facebook"></i> בפייסבוק</a>
  </div>

  <!-- NAV -->
  <nav>
    <a href="#about">אודות</a>
    <a href="#music">מוזיקה יוונית</a>
    <a href="#lectures">הרצאות וסדנאות</a>
    <a href="#athens">סיורים באתונה</a>
    <a href="#events">אירועים ומופעים</a>
    <a href="#contact">צור קשר</a>
  </nav>
</header>

<main>
  <!-- HERO SECTION -->
  <section id="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1 class="hero-title">oren.greek</h1>
      <p class="hero-subtitle">מוזיקה יוונית, תרבות, אירועים וסיורים באתונה</p>
    </div>
  </section>
</main>

</body>
</html>
