<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oren.greek — מוזיקה יוונית, אירועים ואתונה</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f141c;
            color: #f4f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1a2332;
            padding: 40px 20px;
            border-radius: 16px;
            border: 1px solid #2a364f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #dfb15b;
            font-size: 2.2rem;
            margin-bottom: 12px;
        }
        p {
            color: #a0aec0;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: #dfb15b;
            color: #0f141c;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #f3c77c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>oren.greek</h1>
        <p>מוזיקה יוונית, אירועים ואתונה</p>
        
        <!-- כפתור מעבר לפלייליסט -->
        <a href="https://www.youtube.com" target="_blank" class="btn">🎵 לפלייליסט ב-YouTube</a>
    </div>

</body>
</html>
