<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oren.greek — מוזיקה יוונית, אירועים ואתונה</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f141c;
            color: #f4f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #dfb15b;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #a0aec0;
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .player-wrapper {
            margin: 20px 0;
            position: relative;
            padding-bottom: 56.25%; /* יחס תצוגה 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #2a364f;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .playlist-link {
            display: inline-block;
            margin-top: 15px;
            color: #dfb15b;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>oren.greek</h1>
        <p>מוזיקה יוונית, אירועים ואתונה</p>
        
        <!-- נגן הפלייליסט המובנה -->
        <div class="player-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/videoseries?list=YOUR_PLAYLIST_ID_HERE" 
                title="oren.greek Playlist" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- הקישור הקיים בתחתית הדף -->
        <a href="YOUR_PLAYLIST_URL_HERE" target="_blank" class="playlist-link">
            פתח את הפלייליסט ישירות ב-YouTube 🎵
        </a>
    </div>
</body>
</html>
